@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
.aa{font-family:'IBM Plex Sans',system-ui,sans-serif;color:${f.ink};background:${f.bg};font-size:13px;line-height:1.45}
.aa *{box-sizing:border-box}
.aa ::selection{background:rgba(56,214,245,.3)}
.disp{font-family:'Chakra Petch','IBM Plex Sans',sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
.bgfield{background:
  radial-gradient(1200px 600px at 55% -10%,rgba(56,214,245,.07),transparent 60%),
  radial-gradient(900px 500px at 100% 100%,rgba(44,199,176,.05),transparent 60%),${f.bg}}
.panel{background:linear-gradient(180deg,rgba(17,27,44,.82),rgba(10,17,29,.86));border:1px solid rgba(125,180,220,.13);border-radius:6px;box-shadow:0 14px 30px -18px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.035)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(125,180,220,.09);min-height:42px}
.pt{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;color:#d4e6f5}
.lbl{font-size:10.5px;letter-spacing:.09em;color:#7c93aa;font-weight:500;text-transform:uppercase}
.hair{border-color:rgba(125,180,220,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border:1px solid rgba(125,180,220,.24);background:rgba(56,214,245,.04);color:#d0e3f2;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:11px;letter-spacing:.1em;border-radius:4px;cursor:pointer;transition:background .12s,border-color .12s,transform .06s;white-space:nowrap}
.btn:hover{background:rgba(56,214,245,.11);border-color:rgba(56,214,245,.45)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-p{background:${f.cyan};border-color:${f.cyan};color:#03141c}
.btn-p:hover{background:#6fe3fa;border-color:#6fe3fa}
.btn-d{border-color:rgba(239,68,68,.5);color:#fca5a5;background:rgba(239,68,68,.06)}
.btn-d:hover{background:rgba(239,68,68,.14);border-color:${f.crit}}
.btn-s{height:26px;padding:0 9px;font-size:10.5px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:4px;border:1px solid transparent;background:transparent;color:#a9bdd1;cursor:pointer}
.ibtn:hover{background:rgba(125,180,220,.08);border-color:rgba(125,180,220,.16);color:#e3eef8}
.aa button:focus-visible,.aa input:focus-visible,.aa select:focus-visible,.aa [tabindex]:focus-visible{outline:2px solid ${f.cyan};outline-offset:2px}
.field{width:100%;height:40px;border-radius:4px;border:1px solid rgba(125,180,220,.22);background:rgba(4,9,16,.7);color:${f.ink};padding:0 12px;font-size:13.5px}
.field::placeholder{color:#56708a}
.field:focus{border-color:${f.cyan};outline:none;box-shadow:0 0 0 3px rgba(56,214,245,.14)}
.sel{height:28px;border-radius:4px;border:1px solid rgba(125,180,220,.22);background:#08101c;color:${f.ink};padding:0 6px;font-size:12px}
.tipw{position:relative;display:inline-flex}
.tip{position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);background:#0d1828;border:1px solid rgba(125,180,220,.25);color:#d7e6f3;font-size:11px;font-weight:500;letter-spacing:.01em;padding:5px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s .15s;z-index:120;box-shadow:0 8px 20px rgba(0,0,0,.5);text-transform:none;font-family:'IBM Plex Sans',sans-serif}
.tip.b{top:calc(100% + 7px);bottom:auto}
.tip.r{left:calc(100% + 8px);top:50%;bottom:auto;transform:translateY(-50%)}
.tipw:hover>.tip,.tipw:focus-within>.tip{opacity:1}
@keyframes aapulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:aapulse 1.6s ease-in-out infinite}
@keyframes aaflash{0%{box-shadow:0 0 0 2px rgba(56,214,245,.8)}100%{box-shadow:0 0 0 2px rgba(56,214,245,0)}}
.flash{animation:aaflash 1.2s ease-out}
@keyframes aain{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.enter{animation:aain .18s ease-out}
@keyframes aashimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skel{background:linear-gradient(90deg,rgba(125,180,220,.05),rgba(125,180,220,.12),rgba(125,180,220,.05));background-size:400px 100%;animation:aashimmer 1.2s linear infinite;border-radius:4px}
.nlabel{position:absolute;left:0;top:0;display:none;pointer-events:auto;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;padding:1px 5px;border-radius:3px;border:1px solid;background:rgba(5,10,18,.82);color:#dce9f5;white-space:nowrap;line-height:15px}
.nlabel.sel{font-size:11px;padding:2px 7px;background:rgba(8,16,28,.95)}
.plabel{position:absolute;left:0;top:0;display:none;pointer-events:none;font-family:'Chakra Petch',sans-serif;font-size:10px;letter-spacing:.14em;color:rgba(170,200,225,.55);white-space:nowrap}
.scroll::-webkit-scrollbar{width:8px;height:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(125,180,220,.18);border-radius:8px}.scroll::-webkit-scrollbar-track{background:transparent}
.navi{display:flex;align-items:center;gap:11px;width:100%;height:34px;padding:0 12px;border-radius:4px;color:#9fb4c9;background:transparent;border:1px solid transparent;cursor:pointer;font-size:12.5px;text-align:left}
.navi:hover{background:rgba(125,180,220,.07);color:#e3eef8}
.navi.on{background:rgba(56,214,245,.09);border-color:rgba(56,214,245,.22);color:#e8f7fc}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.08em;font-family:'Chakra Petch',sans-serif;border:1px solid}
.tab{height:28px;padding:0 10px;font-family:'Chakra Petch';font-weight:600;font-size:11px;letter-spacing:.1em;color:#8aa0b6;border-bottom:2px solid transparent;background:none;cursor:pointer}
.tab.on{color:#e7f5fb;border-color:${f.cyan}}
.row-h:hover{background:rgba(125,180,220,.05)}
@media (prefers-reduced-motion: reduce){.pulse,.skel,.flash,.enter{animation:none!important}}
